app:
  name: airqo-stage-website-api
  label: stawebsite-api
  secret: sta-env-website-backend
  namespace: staging
replicaCount: 1
image:
  repository: airqoacr.azurecr.io/airqo-stage-website-api
  tag: stage-61888182-1794864423
resources:
  limits:
    cpu: 500m
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 320Mi
volumeMounts:
  - name: config-volume
    mountPath: /etc/config
volumes:
  - name: config-volume
    configMap:
      name: stage-website-api-config-files
ingress:
  enabled: false
service:
  type: NodePort
  port: 8000
  protocol: TCP
  targetPort: 8000
  nodePort: 31020
autoscaling:
  minReplicas: 1
  maxReplicas: 2
  targetMemoryUtilizationPercentage: 70
rollingUpdate:
  maxSurge: 1
  maxUnavailable: 0
