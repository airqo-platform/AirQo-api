apiVersion: k8s.nginx.org/v1
kind: VirtualServer
metadata:
  name: staging-netmanager-virtual-server
  namespace: staging
spec:
  host: staging-netmanager.airqo.net
  upstreams:
    - name: platform-ui
      service: airqo-stage-platform-frontend-svc
      port: 80
    - name: auth-service
      service: airqo-stage-auth-api-svc
      port: 3000
    - name: device-registry
      service: airqo-stage-device-registry-api-svc
      port: 3000
    - name: analytics-api
      service: airqo-stage-analytics-api-svc
      port: 5000
    - name: predict
      service: airqo-stage-prediction-api-svc
      port: 5000
    - name: calibrate
      service: airqo-stage-calibrate-api-svc
      port: 4001
    - name: view
      service: airqo-stage-view-api-svc
      port: 8080
    - name: spatial
      service: airqo-stage-spatial-api-svc
      port: 5000
    - name: beacon
      service: airqo-stage-beacon-api-svc
      port: 8000
  routes:
    - path: /
      action:
        redirect:
          url: https://staging-vertex.airqo.net
          code: 301
    - path: ~ /api\/v[1-2]\/users
      action:
        proxy:
          upstream: auth-service
          responseHeaders:
            add:
              - name: Content-Type
                value: application/json
    - path: ~ /api\/v[1-2]\/devices
      action:
        proxy:
          upstream: device-registry
          responseHeaders:
            add:
              - name: Content-Type
                value: application/json
    - path: ~ /api\/(?:v[1-2]\/|v3\/public\/)analytics
      action:
        proxy:
          upstream: analytics-api
          requestHeaders:
            pass: true
            # Real client IP for the analytics API's rate limiter. NGINX
            # resolves $remote_addr from PROXY protocol (see global-config
            # real-ip-header), and setting the header OVERWRITES any value
            # the caller sent, so it cannot be spoofed to evade limits.
            set:
              - name: X-Forwarded-For
                value: ${remote_addr}
          responseHeaders:
            add:
              - name: Content-Type
                value: application/json
    - path: ~ /api\/v[1-2]\/predict
      action:
        proxy:
          upstream: predict
          responseHeaders:
            add:
              - name: Content-Type
                value: application/json
    - path: ~ /api\/v[1-2]\/calibrate
      action:
        proxy:
          upstream: calibrate
          responseHeaders:
            add:
              - name: Content-Type
                value: application/json
    - path: ~ /api\/v[1-2]\/view
      action:
        proxy:
          upstream: view
          responseHeaders:
            add:
              - name: Content-Type
                value: application/json
    - path: ~ /api\/v[1-2]\/spatial
      action:
        proxy:
          upstream: spatial
          responseHeaders:
            add:
              - name: Content-Type
                value: application/json
    - path: ~ ^/api\/v[1-2]\/beacon(?:/(.*))?$
      action:
        proxy:
          upstream: beacon
          rewritePath: /$1
          responseHeaders:
            add:
              - name: Content-Type
                value: application/json
