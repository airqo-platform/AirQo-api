apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.api.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "airqo-analytics.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
        app: {{ .Values.api.label }}
  replicas: {{ .Values.api.replicaCount }}
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  minReadySeconds: 5
  template:
    metadata:
      {{- with .Values.api.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        app: {{ .Values.api.label }}
    spec:
      nodeSelector:
        {{- if .Values.api.nodeSelector }}
        {{- toYaml .Values.api.nodeSelector | nindent 8 }}
        {{- end }}
      affinity:
        {{- if .Values.api.affinity }}
        {{- toYaml .Values.api.affinity | nindent 8 }}
        {{- end }}
      containers:
        - name: {{ .Values.api.label }}
          image: "{{ .Values.images.repositories.api }}:{{ .Values.images.tag}}"
          imagePullPolicy: IfNotPresent
          {{- $apiPort := include "getTargetPortByName" (list . "analytics-api") }}
          ports:
            - containerPort: {{ $apiPort }}
              name: {{ .Values.api.label }}
          envFrom:
            - configMapRef:
                name: {{ .Values.api.configmap }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            limits:
              cpu: {{ .Values.api.resources.common.limits.cpu }}
              memory: {{ .Values.api.resources.common.limits.memory }}
            requests:
              cpu: {{ .Values.api.resources.common.requests.cpu }}
              memory: {{ .Values.api.resources.common.requests.memory }}
          # /health is a pure liveness check; /health/ready additionally pings
          # Redis. BigQuery is deliberately not probed — see main.py.
          livenessProbe:
            httpGet:
              path: /health
              port: {{ $apiPort }}
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: {{ $apiPort }}
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
        # Deliberately not deployed here (config retained in values.yaml):
        #
        #   redis  — a sidecar is pod-local, so each replica would get its own
        #            instance: rate-limit counters would be per-pod and each
        #            pod's Celery worker would use a different broker.
        #            REDIS_SERVER must point at a Redis shared by all replicas.
        #
        #   celery-beat — a scheduler must be a singleton. Running it in a
        #            replicaCount>1 Deployment means N schedulers enqueueing
        #            the same tick. It needs its own replicas:1 Deployment.
        #
        #   celery-worker — its image is not built by CI for now; it returns
        #            as its own Deployment alongside beat.
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
