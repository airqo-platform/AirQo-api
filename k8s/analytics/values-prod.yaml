# Currently not used.
namespace: production
nameOverride: ""
fullnameOverride: ""
images:
  repositories:
    api: eu.gcr.io/airqo-250220/airqo-analytics-api
    # Not deployed by this chart — beat needs its own replicas:1 Deployment.
    # celeryBeat: eu.gcr.io/airqo-250220/airqo-analytics-celery-beat
    # celeryWorker: eu.gcr.io/airqo-250220/airqo-analytics-celery-worker
    # reportJob: eu.gcr.io/airqo-250220/airqo-analytics-report-job
    # Not deployed by this chart — Redis must be shared across replicas, so it
    # cannot be a pod-local sidecar. Point REDIS_SERVER at a shared instance.
    # redisContainer: eu.gcr.io/airqo-250220/airqo-redis
    # devicesSummaryJob: eu.gcr.io/airqo-250220/airqo-analytics-devices-summary-job
  tag: prod-9a4385dc-1771443288
api:
  name: airqo-analytics-api
  label: analytics-api
  configmap: env-analytics-production
  replicaCount: 3
  podAnnotations: {}
  resources:
    common:
      limits:
        cpu: 250m
        memory: 1000Mi
      requests:
        cpu: 10m
        memory: 250Mi
    # Retained for a future standalone Redis workload; the sidecar is gone.
    redis:
      requests:
        cpu: 50m
        memory: 10Mi
      limits:
        cpu: 300m
        memory: 50Mi
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - preference:
            matchExpressions:
              - key: role
                operator: In
                values:
                  - moderate-usage
          weight: 1
# Retained for the report-job CronJob, which is not deployed by this chart.
jobs:
  reports:
    name: prod-analytics-report
    configmap: env-analytics-report-production
  resources:
    limits:
      cpu: 1000m
      memory: 3000Mi
    requests:
      cpu: 100m
      memory: 500Mi
volumeMounts:
  - name: config-volume
    mountPath: /etc/config
volumes:
  - name: config-volume
    configMap:
      name: prod-analytics-config-files
service:
  type: NodePort
  ports:
    - name: analytics-api
      port: 5000
      protocol: TCP
      targetPort: 5000
      nodePort: 30003
    # No pod backs this since the Redis sidecar was removed; retained so the
    # nodePort stays reserved for a future standalone Redis Service.
    - name: redis-server
      port: 6379
      targetPort: 6379
      nodePort: 30114
      protocol: TCP
ingress:
  enabled: false
autoscaling:
  minReplicas: 1
  maxReplicas: 3
  targetMemoryUtilizationPercentage: 85
