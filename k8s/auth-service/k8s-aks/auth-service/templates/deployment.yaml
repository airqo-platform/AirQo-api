apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.app.name }}
  labels:
    {{- include "airqo-auth-api.labels" . | nindent 4 }}
spec:
  {{- $rollingUpdate := .Values.rollingUpdate | default dict }}
  selector:
    matchLabels:
      app: {{ .Values.app.label }}
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ if hasKey $rollingUpdate "maxSurge" }}{{ $rollingUpdate.maxSurge }}{{ else }}1{{ end }}
      maxUnavailable: {{ if hasKey $rollingUpdate "maxUnavailable" }}{{ $rollingUpdate.maxUnavailable }}{{ else }}1{{ end }}
  minReadySeconds: 5
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        app: {{ .Values.app.label }}
    spec:
      containers:
        - name: {{ .Values.app.label }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ default "IfNotPresent" .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
              name: {{ .Values.app.label }}
          envFrom:
            - secretRef:
                name: {{ .Values.app.secret }}   #external secret reference
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
