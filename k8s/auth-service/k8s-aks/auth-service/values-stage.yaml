app:
  name: airqo-stage-auth-api
  label: sta-auth-api
  secret: sta-env-auth-service
  namespace: staging
replicaCount: 1
image:
  repository: airqoacr.azurecr.io/airqo-stage-auth-api
  tag: stage-471634d3-1795072151
  pullPolicy: IfNotPresent
resources:
  limits:
    cpu: 300m
    memory: 768Mi
  requests:
    cpu: 10m
    memory: 400Mi
volumeMounts:
  - name: config-volume
    mountPath: /etc/config
volumes:
  - name: config-volume
    configMap:
      name: stage-auth-api-config-files
ingress:
  enabled: false
service:
  type: NodePort
  port: 3000
  protocol: TCP
  targetPort: 3000
  nodePort: 31000
autoscaling:
  minReplicas: 1
  maxReplicas: 2
  targetMemoryUtilizationPercentage: 80
rollingUpdate:
  maxSurge: 1
  maxUnavailable: 0
