app:
  name: workflows
  label: workflows
  secret: sta-env-airflow
  namespace: pipeline
  serviceAccount: stage-airflow-sa
replicaCount: 1
images:
  repositories:
    initContainer: airqoacr.azurecr.io/airqo-stage-workflows-xcom
    redisContainer: airqoacr.azurecr.io/airqo-stage-redis
    containers: airqoacr.azurecr.io/airqo-stage-workflows
  tag: stage-d6b26b9f-1793863559
inPodRedis:
  enabled: true
checkMigrations:
  enabled: true
  waitTimeoutSeconds: 600
migrationJob:
  enabled: false
  args:
    - db
    - migrate
  activeDeadlineSeconds: 1800
dagProcessor:
  enabled: true
livenessProbes:
  enabled: true
dbClean:
  enabled: true
  schedule: '30 0 * * 0'
  retentionDays: 30
  activeDeadlineSeconds: 3600
  tables:
    - callback_request
    - celery_taskmeta
    - celery_tasksetmeta
    - dag_run
    - dataset_event
    - import_error
    - job
    - log
    - session
    - sla_miss
    - task_fail
    - task_instance
    - task_instance_history
    - task_reschedule
    - trigger
    - xcom
resources:
  initContainer:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 80Mi
  webserver:
    requests:
      cpu: 125m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1500Mi
  scheduler:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 3000m
      memory: 1800Mi
  celery:
    requests:
      cpu: 125m
      memory: 512Mi
    limits:
      cpu: 2500m
      memory: 3000Mi
  redis:
    requests:
      cpu: 5m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  checkMigrations:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  migrationJob:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1500m
      memory: 1800Mi
  dagProcessor:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1500Mi
  dbClean:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1500Mi
volumeMounts:
  - name: config-volume
    mountPath: /etc/config
  - name: xcom-config-volume
    mountPath: /etc/airflow_xcom
volumes:
  - name: config-volume
    configMap:
      name: airflow-config-files
  - name: xcom-config-volume
    emptyDir: {}
ingress:
  enabled: false
service:
  type: NodePort
  ports:
    - name: web-server
      port: 8080
      targetPort: 8080
      nodePort: 30036
      protocol: TCP
    - name: redis-server
      port: 6379
      targetPort: 6379
      nodePort: 30079
      protocol: TCP
autoscaling:
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 70
