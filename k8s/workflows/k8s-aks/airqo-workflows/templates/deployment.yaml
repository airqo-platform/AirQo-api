apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.app.name }}
  namespace: {{ .Values.app.namespace }}
  labels:
    {{- include "airqo-workflows.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: {{ .Values.app.label }}
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  minReadySeconds: 5
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        app: {{ .Values.app.label }}
    spec:
      restartPolicy: Always
      terminationGracePeriodSeconds: 600
      serviceAccountName: {{ .Values.app.serviceAccount }}

      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}

      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}

      initContainers:
        {{- include "airqo-workflows.xcomInitContainer" . | nindent 8 }}
        {{- if .Values.checkMigrations.enabled }}
        {{- include "airqo-workflows.checkMigrationsInitContainer" . | nindent 8 }}
        {{- end }}
      containers:
        - name: '{{ .Values.app.name }}-scheduler'
          image: "{{ .Values.images.repositories.containers }}:{{ .Values.images.tag }}"
          imagePullPolicy: {{ default "IfNotPresent" .Values.images.pullPolicy }}
          envFrom:
            - secretRef:
                name: {{ .Values.app.secret }}
          {{- if .Values.dagProcessor.enabled }}
          env:
            {{- include "airqo-workflows.standaloneDagProcessorEnv" . | nindent 12 }}
          {{- end }}
          command: ["airflow"]
          args: ["scheduler"]
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            limits:
              cpu: {{ .Values.resources.scheduler.limits.cpu }}
              memory: {{ .Values.resources.scheduler.limits.memory }}
            requests:
              cpu: {{ .Values.resources.scheduler.requests.cpu }}
              memory: {{ .Values.resources.scheduler.requests.memory }}
          {{- if .Values.livenessProbes.enabled }}
          livenessProbe:
            initialDelaySeconds: 120
            periodSeconds: 60
            timeoutSeconds: 30
            failureThreshold: 5
            exec:
              command: ["airflow", "jobs", "check", "--job-type", "SchedulerJob", "--local"]
          {{- end }}
        - name: '{{ .Values.app.name }}-celery'
          image: "{{ .Values.images.repositories.containers }}:{{ .Values.images.tag }}"
          imagePullPolicy: {{ default "IfNotPresent" .Values.images.pullPolicy }}
          envFrom:
            - secretRef:
                name: {{ .Values.app.secret }}
          command: ["airflow"]
          args: ["celery", "worker", "--autoscale=6,2"]
          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - "airflow celery stop; sleep 5"
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            limits:
              cpu: {{ .Values.resources.celery.limits.cpu }}
              memory: {{ .Values.resources.celery.limits.memory }}
            requests:
              cpu: {{ .Values.resources.celery.requests.cpu }}
              memory: {{ .Values.resources.celery.requests.memory }}
          {{- if .Values.livenessProbes.enabled }}
          livenessProbe:
            initialDelaySeconds: 120
            periodSeconds: 60
            timeoutSeconds: 30
            failureThreshold: 5
            exec:
              command:
                - sh
                - -c
                - 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$HOSTNAME"'
          {{- end }}
        - name: '{{ .Values.app.name }}-webserver'
          image: "{{ .Values.images.repositories.containers }}:{{ .Values.images.tag }}"
          imagePullPolicy: {{ default "IfNotPresent" .Values.images.pullPolicy }}
          {{- $webTargetPort := include "getTargetPortByName" (list . "web-server") }}
          ports:
            - containerPort: {{ $webTargetPort }}
              name: web-server
          envFrom:
            - secretRef:
                name: {{ .Values.app.secret }}
          command: ["airflow"]
          args: ["webserver"]
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            limits:
              cpu: {{ .Values.resources.webserver.limits.cpu }}
              memory: {{ .Values.resources.webserver.limits.memory }}
            requests:
              cpu: {{ .Values.resources.webserver.requests.cpu }}
              memory: {{ .Values.resources.webserver.requests.memory }}
          readinessProbe:
            initialDelaySeconds: 120
            timeoutSeconds: 120
            httpGet:
              path: /workflows/health
              port: {{ $webTargetPort }}
        {{- if .Values.inPodRedis.enabled }}
        - name: '{{ .Values.app.name }}-redis'
          image: "{{ .Values.images.repositories.redisContainer }}:{{ .Values.images.tag }}"
          imagePullPolicy: {{ default "IfNotPresent" .Values.images.pullPolicy }}
          {{- $redisPort := include "getTargetPortByName" (list . "redis-server") }}
          ports:
            - containerPort: {{ $redisPort }}
              name: redis
          envFrom:
            - secretRef:
                name: {{ .Values.app.secret }}
          command: ["redis-server"]
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            limits:
              cpu: {{ .Values.resources.redis.limits.cpu }}
              memory: {{ .Values.resources.redis.limits.memory }}
            requests:
              cpu: {{ .Values.resources.redis.requests.cpu }}
              memory: {{ .Values.resources.redis.requests.memory }}
          readinessProbe:
            initialDelaySeconds: 10
            timeoutSeconds: 5
            tcpSocket:
              port: {{ $redisPort }}
        {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
